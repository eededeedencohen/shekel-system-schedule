<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוז פרויקט שק"ל · ספטמבר 2026 – מרץ 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Rubik:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #f7f7f5;
    --bg-card: #ffffff;
    --border: #e6e4df;
    --border-dark: #d6d3cc;
    --text: #1c1c1a;
    --muted: #75726b;
    --ring: #1c1c1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Assistant', -apple-system, sans-serif;
    background: var(--bg-page);
    color: var(--text);
    line-height: 1.45;
    padding-bottom: 60px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .container { max-width: 1240px; margin: 0 auto; padding: 0 18px; }

  /* ---------- Top header ---------- */
  .page-header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 26px 0 20px;
    margin-bottom: 0;
  }

  .header-inner { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; justify-content: space-between; }

  h1 { font-family: 'Rubik', sans-serif; font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; }
  .header-sub { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }

  .today-box {
    text-align: left;
    min-width: 250px;
  }
  .today-date { font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 1.02rem; }
  .today-status { color: var(--muted); font-size: 0.88rem; margin-top: 2px; max-width: 340px; }

  .progress-wrap { margin-top: 14px; }
  .progress-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; }
  .progress-track { height: 6px; background: #ecebe7; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: #1c1c1a; border-radius: 999px; width: 0%; transition: width 0.6s ease; }

  /* ---------- Sticky month nav ---------- */
  .month-nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247, 247, 245, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .month-nav-inner { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-pill {
    border: 1px solid var(--border-dark);
    background: #fff;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: 'Assistant', sans-serif;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-pill:hover { border-color: var(--text); }
  .nav-pill.current { background: #1c1c1a; color: #fff; border-color: #1c1c1a; }

  /* ---------- Legend ---------- */
  .legend {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 18px 0 6px;
  }
  .legend-item {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid;
  }
  .legend-item svg { width: 13px; height: 13px; }

  /* ---------- Month section ---------- */
  .month-section { margin-top: 26px; scroll-margin-top: 70px; }

  .month-head {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
    margin-bottom: 12px; padding: 0 2px;
  }
  .month-name { font-family: 'Rubik', sans-serif; font-size: 1.35rem; font-weight: 700; }
  .month-phase { font-size: 0.85rem; font-weight: 700; color: var(--muted); background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 4px 13px; }
  .month-sub { flex-basis: 100%; color: var(--muted); font-size: 0.88rem; margin-top: -4px; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 9px;
  }

  .day-header {
    text-align: center; font-weight: 700; font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 0 8px;
    letter-spacing: 0.02em;
  }

  /* ---------- Cells ---------- */
  .cell {
    background: #fff;
    border: 1px solid var(--border-dark);
    border-radius: 12px;
    min-height: 112px;
    padding: 10px 11px;
    display: flex; flex-direction: column;
    position: relative;
    transition: box-shadow 0.15s, transform 0.15s;
    overflow: hidden;
  }
  .cell.has-detail { cursor: pointer; }
  .cell.has-detail:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(28, 28, 26, 0.09); }

  .cell.empty { background: transparent; border: 1px dashed var(--border); min-height: 40px; }

  .cell-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .cell-date { font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 1rem; }

  .cell-icon {
    width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cell-icon svg { width: 15px; height: 15px; }

  .cell-title { font-size: 0.85rem; font-weight: 600; line-height: 1.32; flex: 1; }

  .cell-cat {
    margin-top: 8px;
    font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.02em;
    opacity: 0.85;
  }

  /* state: past */
  .cell.past { opacity: 0.5; filter: saturate(0.55); }
  .cell.past:hover { opacity: 0.85; filter: none; }

  /* state: today */
  .cell.today {
    opacity: 1; filter: none;
    box-shadow: 0 0 0 2.5px var(--ring), 0 8px 20px rgba(28,28,26,0.12);
  }
  .today-pill {
    position: absolute; top: -1px; left: 12px;
    background: #1c1c1a; color: #fff;
    font-size: 0.66rem; font-weight: 800;
    padding: 3px 9px 4px;
    border-radius: 0 0 7px 7px;
    letter-spacing: 0.04em;
  }

  .cell.holiday { cursor: default; }
  .cell.holiday .cell-title { font-weight: 700; }

  /* ---------- Miluim block ---------- */
  .miluim {
    margin-top: 26px;
    border: 1px solid #d8ddc9;
    background: linear-gradient(135deg, #f4f6ee 0%, #eef1e4 100%);
    border-radius: 16px;
    padding: 30px 28px;
    display: flex; align-items: center; gap: 22px;
    scroll-margin-top: 70px;
    position: relative;
    overflow: hidden;
  }
  .miluim-icon {
    width: 54px; height: 54px; border-radius: 14px;
    background: #fff; border: 1px solid #d8ddc9;
    display: flex; align-items: center; justify-content: center;
    color: #5b6b3f; flex-shrink: 0;
  }
  .miluim-icon svg { width: 28px; height: 28px; }
  .miluim h2 { font-family: 'Rubik', sans-serif; font-size: 1.25rem; color: #414d2c; }
  .miluim p { color: #5f6a4a; font-size: 0.92rem; margin-top: 5px; max-width: 640px; }
  .miluim .here-badge {
    position: absolute; top: 14px; left: 16px;
    background: #5b6b3f; color: #fff;
    font-size: 0.72rem; font-weight: 800;
    padding: 4px 12px; border-radius: 999px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(28, 28, 26, 0.55);
    backdrop-filter: blur(4px);
    z-index: 999;
    justify-content: center; align-items: center;
    padding: 16px;
  }
  .modal-card {
    background: #fff;
    border-radius: 16px;
    max-width: 680px; width: 100%;
    box-shadow: 0 24px 48px rgba(0,0,0,0.2);
    overflow: hidden;
    display: flex; flex-direction: column;
    animation: modalSlide 0.18s ease-out;
  }
  @keyframes modalSlide {
    from { transform: translateY(10px) scale(0.985); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .modal-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .modal-header-right { display: flex; gap: 12px; align-items: flex-start; }
  .modal-cat-icon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-cat-icon svg { width: 20px; height: 20px; }
  .modal-title-wrap h3 { font-family: 'Rubik', sans-serif; font-size: 1.15rem; line-height: 1.3; }
  .modal-date-badge { font-size: 0.82rem; font-weight: 700; display: inline-block; margin-top: 3px; }
  .modal-close {
    background: #efeeea; border: none; color: #5c5952;
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; font-size: 1.2rem; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: #e2e0da; }

  .modal-body { padding: 18px 22px; overflow-y: auto; max-height: 68vh; }
  .modal-section { margin-bottom: 16px; }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section-title {
    font-weight: 800; font-size: 0.82rem;
    letter-spacing: 0.03em;
    margin-bottom: 7px;
    display: flex; align-items: center; gap: 7px;
  }
  .modal-section-title svg { width: 14px; height: 14px; }
  .modal-list { list-style: none; }
  .modal-list li {
    position: relative; padding-right: 15px;
    margin-bottom: 5px;
    font-size: 0.9rem; color: #3d3b36; line-height: 1.45;
  }
  .modal-list li::before {
    content: ""; position: absolute; right: 2px; top: 0.55em;
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: 0.55;
  }
  .tech-box {
    background: #f7f7f4;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 13px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    direction: ltr; text-align: left;
    line-height: 1.5;
  }
  .hours-badge {
    display: inline-block;
    background: #f7f7f4; border: 1px solid var(--border);
    color: #5c5952;
    padding: 4px 12px; border-radius: 7px;
    font-weight: 700; font-size: 0.8rem;
    margin-top: 12px;
  }

  /* ---------- Print ---------- */
  @media print {
    .month-nav, .progress-wrap, .modal-overlay { display: none !important; }
    body { background: #fff; }
    .month-section { break-inside: avoid; }
    .cell { box-shadow: none !important; }
  }

  @media (max-width: 768px) {
    .calendar-grid { grid-template-columns: 1fr; }
    .day-header { display: none; }
    .cell.empty { display: none; }
    .cell { min-height: auto; }
    .header-inner { align-items: flex-start; }
    .miluim { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

};

/* ============================================================
   Rendering
   ============================================================ */
const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי'];
const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

function pad(n) { return String(n).padStart(2, '0'); }
function isoOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }

const root = document.getElementById('calendarRoot');
const nav = document.getElementById('monthNav');
let doneCount = 0, totalCount = 0;
let currentSectionId = null;

MONTHS.forEach(function (mo, idx) {
  if (mo.miluim) {
    const inMiluim = today >= MILUIM_START && today <= MILUIM_END;
    const sec = document.createElement('section');
    sec.className = 'miluim';
    sec.id = 'sec-miluim';
    sec.innerHTML =
      (inMiluim ? '<span class="here-badge">אתה נמצא כאן</span>' : '') +
      '<div class="miluim-icon">' + icon('shield') + '</div>' +
      '<div>' +
        '<h2>דצמבר 2026 – ינואר 2027 · שירות מילואים</h2>' +
        '<p>המערכת קפואה בגרסה יציבה ומנוטרת (Git Tag: v1.0.0-web-complete). כל ה-Backend וממשקי ה-Web מתועדים, מגובים וממתינים. חוזרים לפיתוח אפליקציית המובייל ב-1 בפברואר 2027.</p>' +
      '</div>';
    root.appendChild(sec);

    const pill = document.createElement('button');
    pill.className = 'nav-pill';
    pill.textContent = 'מילואים · דצמ׳–ינו׳';
    pill.onclick = function () { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    if (inMiluim) { pill.classList.add('current'); currentSectionId = 'sec-miluim'; }
    nav.appendChild(pill);
    return;
  }

  const secId = 'sec-' + mo.y + '-' + mo.m;
  const sec = document.createElement('section');
  sec.className = 'month-section';
  sec.id = secId;

  const isCurrentMonth = (today.getFullYear() === mo.y && today.getMonth() === mo.m);

  let html =
    '<div class="month-head">' +
      '<span class="month-name">' + mo.name + '</span>' +
      '<span class="month-phase">' + mo.phase + '</span>' +
      '<span class="month-sub">' + mo.sub + '</span>' +
    '</div>' +
    '<div class="calendar-grid">';

  DAY_NAMES.forEach(function (d) { html += '<div class="day-header">' + d + '</div>'; });

  const daysInMonth = new Date(mo.y, mo.m + 1, 0).getDate();
  let firstPlaced = false;

  for (let d = 1; d <= daysInMonth; d++) {
    const wd = new Date(mo.y, mo.m, d).getDay();
    if (wd > 4) continue; // Fri/Sat

    if (!firstPlaced) {
      for (let e = 0; e < wd; e++) html += '<div class="cell empty"></div>';
      firstPlaced = true;
    }

    const entry = mo.days[d];
    if (!entry) { html += '<div class="cell empty"></div>'; continue; }

    const catKey = entry[0], title = entry[1];
    const cat = CATS[catKey];
    const iso = isoOf(mo.y, mo.m, d);
    const cellDate = new Date(mo.y, mo.m, d);
    const hasDetail = !!DETAILS[iso];

    const isToday = cellDate.getTime() === today.getTime();
    const isPast = cellDate < today;
    if (catKey !== 'holiday') { totalCount++; if (isPast) doneCount++; }

    let cls = 'cell';
    if (catKey === 'holiday') cls += ' holiday';
    if (hasDetail) cls += ' has-detail';
    if (isToday) cls += ' today';
    else if (isPast) cls += ' past';

    html +=
      '<div class="' + cls + '" style="background:' + cat.bg + ';border-color:' + cat.border + '"' +
        (hasDetail ? ' data-iso="' + iso + '"' : '') + '>' +
        (isToday ? '<span class="today-pill">היום</span>' : '') +
        '<div class="cell-top">' +
          '<span class="cell-date" style="color:' + cat.accent + '">' + d + '</span>' +
          '<span class="cell-icon" style="color:' + cat.accent + ';background:rgba(255,255,255,0.65);border:1px solid ' + cat.border + '">' + icon(cat.icon) + '</span>' +
        '</div>' +
        '<div class="cell-title">' + title + '</div>' +
        '<div class="cell-cat" style="color:' + cat.accent + '">' + cat.label + '</div>' +
      '</div>';
  }

  html += '</div>';
  sec.innerHTML = html;
  root.appendChild(sec);

  const pill = document.createElement('button');
  pill.className = 'nav-pill';
  pill.textContent = mo.name;
  pill.onclick = function () { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  if (isCurrentMonth) { pill.classList.add('current'); currentSectionId = secId; }
  nav.appendChild(pill);
});

/* ---------- Legend ---------- */
const legendEl = document.getElementById('legend');
['social','college','culture','teachers','library','gym','hostel','mobile','infra','qa','special','launch','army','holiday'].forEach(function (key) {
  const c = CATS[key];
  const el = document.createElement('span');
  el.className = 'legend-item';
  el.style.background = c.bg;
  el.style.borderColor = c.border;
  el.style.color = c.accent;
  el.innerHTML = icon(c.icon) + c.label;
  legendEl.appendChild(el);
});

/* ---------- Header: dynamic today + status ---------- */
const fmt = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
document.getElementById('todayDate').textContent = fmt.format(now);

(function setStatus() {
  const statusEl = document.getElementById('todayStatus');
  if (today >= MILUIM_START && today <= MILUIM_END) {
    statusEl.textContent = 'תקופת מילואים — המערכת קפואה בגרסה יציבה. חוזרים לפיתוח ב-1.2.2027.';
    return;
  }
  const wd = today.getDay();
  if (wd > 4) { statusEl.textContent = 'סוף שבוע — אין משימות מתוכננות להיום.'; return; }
  const iso = isoOf(today.getFullYear(), today.getMonth(), today.getDate());
  for (const mo of MONTHS) {
    if (mo.miluim) continue;
    if (mo.y === today.getFullYear() && mo.m === today.getMonth()) {
      const entry = mo.days[today.getDate()];
      if (!entry) { statusEl.textContent = 'אין משימה מתוכננת להיום.'; return; }
      if (entry[0] === 'holiday') { statusEl.textContent = entry[1] + ' — יום חופש, אין משימות.'; return; }
      statusEl.textContent = 'המשימה של היום: ' + entry[1];
      return;
    }
  }
  statusEl.textContent = today < new Date(2026, 8, 1)
    ? 'התוכנית מתחילה ב-1 בספטמבר 2026.'
    : 'התוכנית הסתיימה — המערכת באוויר.';
})();

/* ---------- Progress ---------- */
const pct = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;
document.getElementById('progressText').textContent = doneCount + ' מתוך ' + totalCount + ' ימי עבודה הושלמו';
document.getElementById('progressPct').textContent = pct + '%';
setTimeout(function () { document.getElementById('progressFill').style.width = pct + '%'; }, 150);

/* ---------- Modal ---------- */
const overlay = document.getElementById('modalOverlay');

function openModal(iso) {
  const data = DETAILS[iso];
  if (!data) return;

  const parts = iso.split('-');
  const y = +parts[0], m = +parts[1] - 1, d = +parts[2];
  const dateObj = new Date(y, m, d);

  let catKey = 'infra', title = '';
  for (const mo of MONTHS) {
    if (mo.miluim) continue;
    if (mo.y === y && mo.m === m && mo.days[d]) { catKey = mo.days[d][0]; title = mo.days[d][1]; break; }
  }
  const cat = CATS[catKey];

  document.getElementById('modalTitle').textContent = title;
  const dateBadge = document.getElementById('modalDate');
  dateBadge.textContent = fmt.format(dateObj) + ' · ' + cat.label;
  dateBadge.style.color = cat.accent;

  const catIcon = document.getElementById('modalCatIcon');
  catIcon.style.background = cat.bg;
  catIcon.style.border = '1px solid ' + cat.border;
  catIcon.style.color = cat.accent;
  catIcon.innerHTML = icon(cat.icon);

  document.getElementById('secDeliv').innerHTML = icon('target') + 'תוצרי העבודה הנדרשים';
  document.getElementById('secCheck').innerHTML = icon('list') + 'צ\'ק-ליסט לביצוע';
  document.getElementById('secTech').innerHTML = icon('code') + 'טכנולוגיות וקוד';
  document.querySelectorAll('.modal-section-title').forEach(function (el) { el.style.color = cat.accent; });

  const fill = function (id, items) {
    const ul = document.getElementById(id);
    ul.innerHTML = '';
    ul.style.color = cat.accent;
    items.forEach(function (item) {
      const li = document.createElement('li');
      li.textContent = item;
      ul.appendChild(li);
    });
  };
  fill('modalDeliverables', data.d);
  fill('modalChecklist', data.c);
  document.getElementById('modalTech').textContent = data.t;
  document.getElementById('modalHours').textContent = 'הקצאת זמן: ' + (data.h || '8 שעות עבודה נטו');

  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.style.display = 'none';
  document.body.style.overflow = 'auto';
}

document.addEventListener('click', function (e) {
  const cell = e.target.closest('.cell[data-iso]');
  if (cell) openModal(cell.dataset.iso);
});
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

/* ---------- Auto-scroll to current position ---------- */
setTimeout(function () {
  const todayCell = document.querySelector('.cell.today');
  if (todayCell) {
    todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (currentSectionId) {
    document.getElementById(currentSectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}, 300);
</script>
</body>
</html>
